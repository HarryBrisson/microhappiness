[project]
name = "microhappiness"
version = "0.0.1"
description = "Modeled small-area subjective-happiness estimates for the US (GSS x ACS, CDC PLACES-style MRP)."
readme = "README.md"
# Pinned to the minor version the published estimates were built with (3.12.7, see .python-version).
# Core numeric stack is pinned exactly to the versions the published run used; transitive
# versions live in poetry.lock — install with `poetry install`, not bare pip.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (==3.0.3)",
    "numpy (==2.4.6)",
    "scipy (==1.18.0)",
    "statsmodels (==0.14.6)",   # logit/OLS fits; design_info location has moved between releases
    "patsy (==1.0.2)",          # used directly to rebuild seed-cell design matrices
]

[tool.poetry]
packages = [{ include = "microhappiness" }]

# Only needed for diagnostics/make_visuals.py, build_panel.py and temporal_check.py.
[tool.poetry.group.viz]
optional = true

[tool.poetry.group.viz.dependencies]
matplotlib = ">=3.11.0,<3.12"
geopandas = ">=1.1.3,<1.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
